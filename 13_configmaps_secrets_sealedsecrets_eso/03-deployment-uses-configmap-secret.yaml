apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-demo
  namespace: demo-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-demo
  template:
    metadata:
      labels:
        app: web-demo
    spec:
      containers:
      - name: nginx
        image: nginx:stable
        ports:
        - containerPort: 80
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        volumeMounts:
        - name: site
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: site
        configMap:
          name: web-config
          items:
          - key: index.html
            path: index.html