apiVersion: apps/v1
kind: Deployment
metadata:
  name: apparel
  namespace: mystore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apparel
  template:
    metadata:
      labels:
        app: apparel
    spec:
      containers:
      - name: apparel
        image: apparel-api:latest
        imagePullPolicy: Never          # use local minikube image
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: apparel-svc
  namespace: mystore
spec:
  selector:
    app: apparel
  ports:
  - port: 80
    targetPort: 8080
