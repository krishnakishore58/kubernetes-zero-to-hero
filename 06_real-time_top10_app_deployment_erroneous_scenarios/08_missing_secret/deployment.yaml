apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-missing-secret
  labels:
    app: demo-app
    tier: frontend
spec:
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        tier: frontend
    spec:
      containers:
      - name: demo-app
        image: docker.io/library/demo-app:1.0	#image tag must exist 
        ports:
        - containerPort: 8080
        env:
        - name: READINESS_PATH
          valueFrom:
            secretKeyRef:
              name: application-secret1
              key: READINESS_PATH
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
