apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: default
  labels:
    app: mongo
spec:
  clusterIP: None          # <-- this makes it Headless (no VIP, no load balancing)
  selector:
    app: mongo
  ports:
  - port: 27017
    targetPort: 27017
# DNS entries created per pod:
#   mongo-0.mongo.default.svc.cluster.local
#   mongo-1.mongo.default.svc.cluster.local
#   mongo-2.mongo.default.svc.cluster.local
