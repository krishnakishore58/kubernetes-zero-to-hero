apiVersion: v1
kind: Pod
metadata:
  name: pod-using-demo-pvc
spec:
  containers:
  - name: busybox
    image: busybox:1.35
    command: ["sh", "-c", "sleep 3600"]
    volumeMounts:
    - mountPath: /data
      name: demo-storage
  volumes:
  - name: demo-storage
    persistentVolumeClaim:
      claimName: demo-pvc
