apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: autoscale-demo
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
      - name: demo
        # small python-based demo server that increases CPU and allocates memory per request
        image: python:3.11-slim
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "15Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          mkdir -p /app
          cat > /app/server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import urllib.parse as up
          import threading, time
          mem_store = []
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  qs = up.urlparse(self.path).query
                  params = up.parse_qs(qs)
                  # allocation size per request in KB
                  size_kb = int(params.get('size_kb', ['200'])[0])
                  cpu_work = int(params.get('cpu_work', ['50000'])[0])
                  # allocate and hold memory
                  mem_store.append(bytearray(1024 * size_kb))
                  # cheap CPU work
                  s = 0
                  for i in range(cpu_work):
                      s += (i * 3) % 97
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(f"ok size_kb={size_kb} cpu_work={cpu_work} mem_items={len(mem_store)} sum={s}\n".encode())
              def log_message(self, format, *args):
                  return
          if __name__ == '__main__':
              server = HTTPServer(('0.0.0.0', 8080), Handler)
              print("Starting server on 0.0.0.0:8080")
              server.serve_forever()
          PY
          python3 /app/server.py
---

apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: autoscale-demo
spec:
  selector:
    app: demo-app
  ports:
    - port: 8080
      targetPort: 8080
