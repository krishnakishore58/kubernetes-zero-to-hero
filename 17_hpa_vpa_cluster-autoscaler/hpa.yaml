apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-app-hpa
  namespace: autoscale-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        # option A (utilization of request): keep this if you want percent of request
        type: Utilization
        averageUtilization: 50
        # OR option B (fixed per-pod target): uncomment to use a fixed target
        # type: AverageValue
        # averageValue: "150m"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      # add a Pods policy to make steps deterministic at small replica counts
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
      - type: Percent
        value: 50
        periodSeconds: 300
      # also allow at most 1 pod removal per minute (safer for small deployments)
      - type: Pods
        value: 1
        periodSeconds: 60
