apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: efk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
        imagePullPolicy: IfNotPresent
        env:
        - name: discovery.type
          value: "single-node"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
            #- name: ES_JAVA_OPTS
          # keep heap small for local demo and disable the JVM JMX reconfigure that fails when cgroup info is not visible
          #          value: "-Xms512m -Xmx512m -XX:+UseContainerSupport -Djdk.internal.platform.useContainerSupport=false"
        - name: bootstrap.memory_lock
          value: "false"
        - name: ingest.geoip.downloader.enabled
          value: "false"
        - name: xpack.ml.enabled
          value: "false"
        ports:
        - containerPort: 9200
        volumeMounts:
        - name: esdata
          mountPath: /usr/share/elasticsearch/data
            #        - name: sys-fs-cgroup
            #mountPath: /sys/fs/cgroup
            #readOnly: true
      volumes:
      - name: esdata
        emptyDir: {}
          #- name: sys-fs-cgroup
          #hostPath:
          #path: /sys/fs/cgroup
          #type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: efk
spec:
  selector:
    app: elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
    protocol: TCP
  type: ClusterIP
