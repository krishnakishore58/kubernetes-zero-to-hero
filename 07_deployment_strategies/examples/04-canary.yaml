## Strategy: Canary
## Analogy: "Sending one canary into the mine before the whole crew goes in"
## What happens: Small % of traffic goes to new version. If healthy, scale up new, scale down old.
---
# Stable deployment (90% traffic — 9 replicas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-stable
  labels:
    app: demo-app
    track: stable
spec:
  replicas: 9
  selector:
    matchLabels:
      app: demo-app
      track: stable
  template:
    metadata:
      labels:
        app: demo-app
        track: stable
    spec:
      containers:
      - name: demo-app
        image: docker.io/library/demo-app:1.0
        ports:
        - containerPort: 8080
---
# Canary deployment (10% traffic — 1 replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-canary
  labels:
    app: demo-app
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
      track: canary
  template:
    metadata:
      labels:
        app: demo-app
        track: canary
    spec:
      containers:
      - name: demo-app
        image: docker.io/library/demo-app:2.0
        ports:
        - containerPort: 8080
---
# Service selects BOTH — traffic split is based on pod ratio (9:1 = 90%:10%)
apiVersion: v1
kind: Service
metadata:
  name: demo-app-svc
spec:
  selector:
    app: demo-app   # matches both stable AND canary pods
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
