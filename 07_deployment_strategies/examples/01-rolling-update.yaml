## Strategy: Rolling Update (Default)
## Analogy: "Replacing tyres on a moving car — one at a time, car never stops"
## What happens: K8s replaces pods gradually. At any point, both old & new versions coexist.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-rolling
  labels:
    app: demo-app
    strategy: rolling-update
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # max 1 extra pod above desired count during update
      maxUnavailable: 1  # max 1 pod can be down during update
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: v1
    spec:
      containers:
      - name: demo-app
        image: docker.io/library/demo-app:1.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-svc
spec:
  selector:
    app: demo-app
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
